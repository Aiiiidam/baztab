# Local stack. `npm run db:up` starts only Postgres for `npm run dev`;
# `docker compose up --build` runs migrate → web + worker with the same images
# that deploy (decision 011), on synthetic data: local file storage shared by
# web and worker, and the deterministic fake inference engine.
x-app-env: &app-env
  NODE_ENV: production
  APP_ORIGIN: http://localhost:3000
  DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
  STORAGE_DRIVER: fs
  STORAGE_FS_ROOT: /data/storage
  STORAGE_ALLOW_FS_IN_PRODUCTION: 'true'
  LOG_LEVEL: info

services:
  db:
    image: postgres:16-alpine
    container_name: 'baztab-db'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 'baztab'
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      <<: *app-env
      PROCESS_ROLE: web
    volumes:
      - recordings:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: 'baztab-worker'
    restart: unless-stopped
    environment:
      <<: *app-env
      PROCESS_ROLE: worker
      INFERENCE_ENGINE: fake
      INFERENCE_ALLOW_FAKE_IN_PRODUCTION: 'true'
    volumes:
      - recordings:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  recordings:
