name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests, build, production guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:all
      - run: npm run test:coverage
      - name: Production build refuses SKIP_AUTH
        run: |
          if SKIP_AUTH=true npm run build > /tmp/skip-auth.log 2>&1; then
            echo "A production build with SKIP_AUTH=true must fail"; exit 1
          fi
          grep -q "SKIP_AUTH=true is not allowed" /tmp/skip-auth.log
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - name: No template routes or default credentials ship
        run: |
          test ! -d .next/server/app/admin
          test ! -d .next/server/app/components
          ! grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' -e 'admin123' -e 'requireAdmin' -e 'bcryptjs' src prisma scripts
      - run: npm run worker:build

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration -- --coverage

  e2e:
    name: End-to-end (web + worker)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker images (web, worker, migrate) and compose smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: baztab-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: baztab-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          load: true
          tags: baztab-migrate:ci
      - name: Web refuses SKIP_AUTH and starts without migration credentials
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          URL=postgresql://postgres:postgres@db:5432/app?schema=public
          # Must exit at boot with the message (src/instrumentation.ts), not serve requests.
          if timeout 60 docker run --rm --network ci -e DATABASE_URL=$URL -e SKIP_AUTH=true \
               -e APP_ORIGIN=http://localhost:3000 -e STORAGE_ALLOW_FS_IN_PRODUCTION=true baztab-web:ci \
               > /tmp/web.log 2>&1; then
            echo "web must refuse SKIP_AUTH=true"; exit 1
          fi
          grep -q 'SKIP_AUTH=true is not allowed' /tmp/web.log
          docker run --rm --network ci -e DATABASE_URL_MIGRATE=$URL baztab-migrate:ci
          docker run --rm --network ci -e DATABASE_URL_MIGRATE=$URL baztab-migrate:ci
          docker run -d --name web --network ci -p 3000:3000 -e DATABASE_URL=$URL \
            -e APP_ORIGIN=http://localhost:3000 -e STORAGE_ALLOW_FS_IN_PRODUCTION=true baztab-web:ci
          docker run -d --name worker --network ci -e DATABASE_URL=$URL \
            -e STORAGE_ALLOW_FS_IN_PRODUCTION=true -e INFERENCE_ALLOW_FAKE_IN_PRODUCTION=true baztab-worker:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          curl -sf http://localhost:3000/api/health | grep -q '"schema":"ok"'
          docker exec worker node -e "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1))"
          docker logs worker | grep -q 'Worker started'
          docker logs web; docker logs worker
